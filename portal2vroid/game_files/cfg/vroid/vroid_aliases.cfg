// Portal 2 VRoid Avatar mod - console commands.
// Executed automatically on every map. Bind any of these to a key, e.g.
//   bind v vroid_tp_toggle

alias vroid_tp_toggle       "script VRoid_ToggleThirdPerson()"
alias vroid_tp_on           "script VRoid_SetThirdPerson(1)"
alias vroid_tp_off          "script VRoid_SetThirdPerson(0)"

alias vroid_avatar_next     "script VRoid_CycleAvatar(1)"
alias vroid_avatar_prev     "script VRoid_CycleAvatar(-1)"
alias vroid_avatar_chell    "script VRoid_SelectAvatarId(0)"

alias vroid_cam_dist_more   "script VRoid_CamAdjust(0,1)"
alias vroid_cam_dist_less   "script VRoid_CamAdjust(0,-1)"
alias vroid_cam_up_more     "script VRoid_CamAdjust(1,1)"
alias vroid_cam_up_less     "script VRoid_CamAdjust(1,-1)"
alias vroid_cam_right_more  "script VRoid_CamAdjust(2,1)"
alias vroid_cam_right_less  "script VRoid_CamAdjust(2,-1)"
alias vroid_cam_reset       "script VRoid_CamReset()"

alias vroid_save            "script VRoid_SavePersistent()"
alias vroid_disable         "script VRoid_Disable()"
alias vroid_status          "script VRoid_Status()"
