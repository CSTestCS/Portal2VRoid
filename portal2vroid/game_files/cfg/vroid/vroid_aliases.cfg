// Portal 2 VRoid Avatar mod - console commands.
// Loaded at game start (autoexec) and on every map. Bind any of these to a key, e.g.
//   bind v vroid_tp_toggle
// Each command first loads the mod script if this map has not loaded it yet.

alias vroid_load            "script_execute vroid/vroid_main; script VRoid_EnsureRunning()"
// Sent by the client-side script after a level or save game has loaded.
alias vroid_kick            "vroid_load"

alias vroid_tp_toggle       "vroid_load; script VRoid_ToggleThirdPerson()"
alias vroid_tp_on           "vroid_load; script VRoid_SetThirdPerson(1)"
alias vroid_tp_off          "vroid_load; script VRoid_SetThirdPerson(0)"

alias vroid_avatar_next     "vroid_load; script VRoid_CycleAvatar(1)"
alias vroid_avatar_prev     "vroid_load; script VRoid_CycleAvatar(-1)"
alias vroid_avatar_chell    "vroid_load; script VRoid_SelectAvatarId(0)"

alias vroid_cam_dist_more   "vroid_load; script VRoid_CamAdjust(0,1)"
alias vroid_cam_dist_less   "vroid_load; script VRoid_CamAdjust(0,-1)"
alias vroid_cam_up_more     "vroid_load; script VRoid_CamAdjust(1,1)"
alias vroid_cam_up_less     "vroid_load; script VRoid_CamAdjust(1,-1)"
alias vroid_cam_right_more  "vroid_load; script VRoid_CamAdjust(2,1)"
alias vroid_cam_right_less  "vroid_load; script VRoid_CamAdjust(2,-1)"
alias vroid_cam_reset       "vroid_load; script VRoid_CamReset()"

alias vroid_save            "vroid_load; script VRoid_SavePersistent()"
alias vroid_disable         "vroid_load; script VRoid_Disable()"
alias vroid_status          "vroid_load; script VRoid_Status()"
